<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>autodl 实验大盘</title>
<script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --panel2:#1f232c; --line:#2a2f3a; --fg:#e6e8ec;
          --muted:#9aa3b2; --accent:#4f8cff; --green:#37c871; --red:#ff5d5d; --yellow:#f5b942; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"PingFang SC",Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; background:var(--panel);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .bal { color:var(--green); font-weight:600; }
  header .spacer { flex:1; }
  button { background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:6px;
           padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--red); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  nav { display:flex; gap:4px; padding:0 20px; background:var(--panel); border-bottom:1px solid var(--line); }
  nav a { padding:10px 16px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; }
  nav a.active { color:var(--fg); border-bottom-color:var(--accent); }
  main { padding:20px; max-width:1200px; margin:0 auto; }
  section { display:none; } section.active { display:block; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card .k { color:var(--muted); font-size:12px; } .card .v { font-size:26px; font-weight:600; margin-top:6px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:18px; }
  .panel h2 { font-size:14px; margin:0 0 12px; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; }
  tr:hover td { background:var(--panel2); }
  .tag { padding:2px 8px; border-radius:10px; font-size:12px; }
  .tag.running,.tag.succeeded { background:rgba(55,200,113,.15); color:var(--green); }
  .tag.failed,.tag.removed { background:rgba(255,93,93,.15); color:var(--red); }
  .tag.shutdown,.tag.starting,.tag.creating { background:rgba(245,185,66,.15); color:var(--yellow); }
  label { display:block; color:var(--muted); font-size:12px; margin:10px 0 4px; }
  input,select,textarea { width:100%; background:var(--panel2); color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:8px; font:inherit; }
  textarea { min-height:70px; font-family:ui-monospace,Menlo,monospace; }
  .row { display:flex; gap:12px; } .row > div { flex:1; }
  .muted { color:var(--muted); } .right { text-align:right; }
  pre { background:#0b0d11; border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto;
        max-height:300px; font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; }
  .modal-bg.show { display:flex; align-items:center; justify-content:center; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px;
           width:min(760px,92vw); max-height:88vh; overflow:auto; }
  .toast { position:fixed; right:20px; bottom:20px; background:var(--panel2); border:1px solid var(--line);
           border-left:3px solid var(--accent); border-radius:8px; padding:12px 16px; z-index:99; max-width:380px; }
  .toast.err { border-left-color:var(--red); }
  canvas { max-height:260px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:4px 10px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>🚀 autodl 实验大盘</h1>
  <span class="muted">余额 <span class="bal" id="balance">…</span></span>
  <span class="spacer"></span>
  <span class="muted" id="active-inst"></span>
  <button onclick="refreshAll()">⟳ 刷新</button>
</header>
<nav>
  <a data-tab="overview" class="active">概览</a>
  <a data-tab="instances">实例</a>
  <a data-tab="submit">提交 &amp; 实验</a>
  <a data-tab="board">大盘</a>
</nav>
<main>
  <!-- 概览 -->
  <section id="overview" class="active">
    <div class="cards" id="summary-cards"></div>
    <div class="row">
      <div class="panel"><h2>任务状态分布</h2><canvas id="chart-runs"></canvas></div>
      <div class="panel"><h2>实例状态分布</h2><canvas id="chart-inst"></canvas></div>
    </div>
  </section>

  <!-- 实例 -->
  <section id="instances">
    <div class="panel">
      <h2>实例 <button class="primary" style="float:right" onclick="doUp()">＋ 新建/开机实例</button></h2>
      <table><thead><tr><th>UUID</th><th>状态</th><th>计费</th><th>区域</th><th>操作</th></tr></thead>
        <tbody id="inst-rows"></tbody></table>
    </div>
    <div class="panel"><h2>GPU 库存</h2><div id="stock" class="chips"></div></div>
  </section>

  <!-- 提交 & 实验 -->
  <section id="submit">
    <div class="panel">
      <h2>提交任务</h2>
      <div class="row">
        <div><label>实例</label><select id="f-instance"></select></div>
        <div><label>执行方式</label>
          <select id="f-mode">
            <option value="remote_script">实例上已有脚本 (remote_script)</option>
            <option value="remote">任意远端命令 (remote)</option>
            <option value="script_text">上传脚本内容 (script_text)</option>
          </select></div>
      </div>
      <label id="f-value-label">脚本路径，如 ~/proj/submit_exec.sh</label>
      <textarea id="f-value" placeholder="~/proj/submit_exec.sh"></textarea>
      <div class="row">
        <div><label>实验名 (run_id/name)</label><input id="f-name" placeholder="exp-lr1e-3"></div>
        <div><label>metrics.json 路径（完成后自动抓取，留空=数据盘/metrics.json）</label><input id="f-metrics" placeholder=""></div>
      </div>
      <label>超参/配置 (JSON，可选)</label>
      <input id="f-config" placeholder='{"lr":0.001,"bs":64}'>
      <div style="margin-top:14px"><button class="primary" onclick="doSubmit()">提交（后台运行）</button>
        <span class="muted" id="submit-hint"></span></div>
    </div>
    <div class="panel">
      <h2>实验记录</h2>
      <table><thead><tr><th>实验</th><th>实例</th><th>状态</th><th>退出码</th><th>用时</th><th>关键指标</th></tr></thead>
        <tbody id="run-rows"></tbody></table>
    </div>
  </section>

  <!-- 大盘 -->
  <section id="board">
    <div class="panel">
      <h2>指标对比</h2>
      <div style="margin-bottom:10px">按指标排序/画图：<select id="board-key" onchange="renderBoard()"></select></div>
      <canvas id="chart-board"></canvas>
    </div>
    <div class="panel"><h2>全部实验 × 指标</h2><div style="overflow:auto"><table id="board-table"></table></div></div>
  </section>
</main>
<div class="modal-bg" id="modal-bg" onclick="if(event.target.id==='modal-bg')closeModal()">
  <div class="modal" id="modal"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
