# autodl 配置示例：复制为 autodl.yaml 后按需修改。
# 注意：Token 不放这里，放环境变量 / .env 的 AUTODL_TOKEN=...（避免误提交泄漏）。
# .env 优先级：当前目录及父目录 .env（项目本地，覆盖全局环境变量）> 本文件旁的 .env
#             > 已导出的环境变量 > ~/.autodl/.env（全局兜底）

base_url: https://api.autodl.com

# 实例规格
image_uuid: base-image-12be412037   # 也可填你的私有镜像，如 image-67b066536a
gpu_spec_uuid: v-48g                 # RTX4090-48G
cuda_v_from: 111                     # 最低 CUDA 11.1
instance_name: task-runner
expand_disk_gb: 10
data_center_list: []                 # 留空=自动调度；填 ["westDC2"] 则锁定区域

# 选区 / 库存
regions: [westDC2, westDC3, beijingDC1]   # --select-region 时按此顺序找有空闲卡的区
stock_region: westDC2
gpu_stock_name: vGPU-48GB                  # 库存里对应 v-48g 的型号名

# 护栏
min_balance_yuan: 10.0               # 账户余额低于此值则中止开机（共享账号下只是兜底，真正约束我的是 budget）

# 共享账号：只算"我自己"的账、只限制"我自己"（详见 USAGE.md §11）
owner: ""                            # 我的标识，如 kedong：新建实例名带 "kedong/" 前缀；
                                     # status/stop-all/守护默认只认带前缀或本地登记过的实例
budget:                              # 0 = 不限。费用口径 = 我开机时段 × 实例小时价（与官方按秒计费一致）
  daily_yuan: 0                      # 今日我的花费上限（触顶拒绝开机/提交，退出码 7）
  weekly_yuan: 0
  monthly_yuan: 0
  max_session_hours: 0               # 单次开机保险丝：开机时在实例内挂 `sleep N; shutdown`，本地断网也生效
  max_run_hours: 0                   # 单个任务默认时限（run --max-hours 覆盖）：实例侧 timeout，超时 exit=124
  max_concurrent: 0                  # 我同时 running 的实例数上限
  max_price_per_hour: 0              # 单台实例小时价上限（元）：开机超价拒绝，新建超价立即释放
  ledger_path: ~/.autodl/ledger.db   # 个人账本，跨项目按人汇总（autodl cost 查）

# 本地状态
registry_path: .autodl/registry.db   # 多实例台账（替代旧的 .instance_uuid）

# 实例上的项目仓库（autodl clone / sync / run --sync 用）
git:
  repo: ""        # 如 https://github.com/you/proj.git；私有 https 库本地 export AUTODL_GIT_TOKEN=...
  branch: main
  dir: ""         # 实例上的目录；留空 = <ssh.remote_workdir>/repo
  depth: 1        # 浅克隆深度（部署副本无需全历史，规避国内拉大仓库中断）；0=全克隆
  turbo: true     # clone/fetch 前 source /etc/network_turbo（AutoDL 学术加速，对 github 有效）
  patches: ""     # 本地 patch 目录（放 *.patch），clone/sync 后自动 git apply。
                  # 改的是别人的仓库时用：补丁存你本地，只改实例工作区、绝不 commit/push；
                  # sync 会先 reset 回干净上游再重放补丁，永不累积。用 NN-name.patch 控顺序。

# 实例环境准备（autodl setup / run --setup 用）
env:
  setup: ""       # 自定义安装命令（最高优先），在仓库目录下执行；留空则自动探测：
                  #   setup.sh > environment.yml > requirements.txt > pyproject.toml
  auto: true
  pip_index: https://pypi.tuna.tsinghua.edu.cn/simple   # 国内镜像源；留空用官方
  academic_turbo: false   # 安装前 source /etc/network_turbo（github/HF 加速）

http:
  timeout_connect: 10.0
  timeout_read: 30.0
  retries: 3        # 仅幂等读接口重试；create/power_*/release 不自动重试
  backoff: 1.5

ssh:
  user: root
  remote_workdir: /root/autodl-tmp   # 数据盘，放代码/数据/日志
  connect_timeout: 20.0
  connect_retries: 5
  retry_interval: 5.0
  identity_file: ""                  # 留空自动探测 ~/.ssh/id_ed25519 等，没有则生成
  config_alias: autodl               # 写入 ~/.ssh/config 的 Host 别名
