[project]
name = "autodl-task-submit"
version = "1.0.1"
description = "Reliable CLI for the AutoDL GPU cloud: instance lifecycle, remote tasks, cost guards, idle auto-shutdown, and batch scheduling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jus1mple" }]
keywords = ["autodl", "gpu", "cloud", "cli", "ssh", "mlops", "scheduler"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Utilities",
]
dependencies = [
    "paramiko>=5.0.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[project.urls]
Homepage = "https://github.com/Jus1mple/autodl_task_submit"
Repository = "https://github.com/Jus1mple/autodl_task_submit"

[project.scripts]
autodl = "autodl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autodl"]

[tool.hatch.build.targets.sdist]
include = ["autodl", "README.md", "LICENSE", "autodl.example.yaml"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
